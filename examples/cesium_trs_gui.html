<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
        <title>LCC CesiumJS TRS GUI Demo</title>
        <script src="./engine/cesium/Cesium.js"></script>
        <style>
            @import url(./engine/cesium/widgets.css);

            html,
            body,
            #cesiumContainer {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            #tip {
                position: absolute;
                top: 8px;
                left: 8px;
                z-index: 10;
                padding: 6px 10px;
                font: 12px/1.5 monospace;
                color: #fff;
                background: rgba(0, 0, 0, 0.5);
                border-radius: 4px;
                pointer-events: none;
            }
        </style>
    </head>

    <body>
        <div id="cesiumContainer"></div>
        <div id="tip">
            TRS Control Panel: Translation(ENU m) / Rotation(deg) / Scale — Waiting for model to load…<br />
            Fixed axes: <span style="color: #ff5555">Red=East E</span> / <span style="color: #55ff55">Green=North N</span> /
            <span style="color: #5599ff">Blue=Up U</span>
        </div>
        <script type="module">
            import { LCCRender } from '../sdk/lcc-sdk-cesium.js';
            // lil-gui: lightweight GUI panel
            import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.esm.js';

            Cesium.Ion.defaultAccessToken =
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwZTgwZmQwNy1jMmU2LTQ3YjAtYmY2OC1lOWQwZGI0OTgwMTciLCJpZCI6ODc4MDIsImlhdCI6MTY0ODcxNTAyMn0.QBB2ZBacHXZRNKQDL204I4VvkwKkjup43ATsPHSK6wQ';

            console.log('cesium version: ' + Cesium.VERSION);

            const viewer = new Cesium.Viewer('cesiumContainer', {
                orderIndependentTranslucency: false,
                useDefaultRenderLoop: true,
                requestRenderMode: true,
                resolutionScale: window.devicePixelRatio,
                maximumRenderTimeChange: Infinity,
                animation: false,
                timeline: false,
                baseLayerPicker: false,
                geocoder: false,
                homeButton: false,
                infoBox: false,
                sceneModePicker: false,
                selectionIndicator: false,
                navigationHelpButton: false
            });

            viewer.scene.debugShowFramesPerSecond = true;
            viewer.scene.screenSpaceCameraController.enableCollisionDetection = false;
            viewer.clock.shouldAnimate = false;
            viewer.scene.screenSpaceCameraController.enableInertia = false;

            // Initial placement matrix (ENU reference frame)
            const initMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(114.0592, 22.5429, 10));

            // Fixed ENU axis indicator: Red=East(E) Green=North(N) Blue=Up(U).
            // Fixed at model origin, does not move with model transform. Used to verify translation direction.
            // Uses entity polyline + depthFailMaterial so axes remain visible when occluded by model/terrain.
            // Note: origin must use the model's real position (getOriginPosition). RTK data position is determined by meta, not initMatrix.
            const axisEntities = []; // axis entities for show/hide toggle
            function addEnuAxes(origin, length = 50) {
                const enu = Cesium.Transforms.eastNorthUpToFixedFrame(origin);
                const axes = [
                    { col: 0, color: Cesium.Color.RED }, // East E
                    { col: 1, color: Cesium.Color.LIME }, // North N
                    { col: 2, color: Cesium.Color.DODGERBLUE } // Up U
                ];
                axes.forEach(({ col, color }) => {
                    const c = Cesium.Matrix4.getColumn(enu, col, new Cesium.Cartesian4());
                    const dir = Cesium.Cartesian3.normalize(new Cesium.Cartesian3(c.x, c.y, c.z), new Cesium.Cartesian3());
                    const end = Cesium.Cartesian3.add(
                        origin,
                        Cesium.Cartesian3.multiplyByScalar(dir, length, new Cesium.Cartesian3()),
                        new Cesium.Cartesian3()
                    );
                    const ent = viewer.entities.add({
                        polyline: {
                            positions: [origin, end],
                            width: 6,
                            arcType: Cesium.ArcType.NONE,
                            material: color,
                            depthFailMaterial: color // still visible when occluded
                        }
                    });
                    axisEntities.push(ent);
                });
                viewer.scene.requestRender();
            }

            // Toggle axis visibility
            function setAxesVisible(show) {
                axisEntities.forEach((ent) => (ent.show = show));
                viewer.scene.requestRender();
            }

            let lccReady = false;

            const dataParam = new URLSearchParams(location.search).get('data');
            const dataPath = dataParam || `${location.origin}/assets/ConfuciusTemple/meta.lcc`;

            const lccObj = LCCRender.load(
                {
                    camera: viewer.camera,
                    scene: viewer.scene,
                    dataPath: dataPath,
                    renderLib: Cesium,
                    canvas: viewer.scene.canvas,
                    useEnv: false,
                    modelMatrix: initMatrix,
                    useIndexDB: true,
                    appKey: null
                },
                (mesh) => {
                    console.log('Lcc object loaded: ', mesh);
                    lccReady = true;

                    // Check if RTK model: meta.epsg > 0 means EPSG geographic coordinates (RTK)
                    const meta = lccObj.getMeta && lccObj.getMeta();
                    const isRTK = !!(meta && meta.epsg && meta.epsg > 0);
                    console.log('meta: ', meta, 'isRTK: ', isRTK);
                    document.getElementById('tip').innerHTML =
                        `Model type: <b style="color:${isRTK ? '#ffd23f' : '#8fd3ff'}">${isRTK ? 'RTK (EPSG geographic)' : 'Standard (local coords)'}</b><br />` +
                        'TRS Control Panel: Translation(ENU m) / Rotation(deg) / Scale<br />' +
                        'Fixed axes: <span style="color:#ff5555">Red=East E</span> / <span style="color:#55ff55">Green=North N</span> / <span style="color:#5599ff">Blue=Up U</span>';

                    const cartesian = lccObj.getOriginPosition();
                    const entity = viewer.entities.add({
                        position: cartesian,
                        point: { pixelSize: 2, color: Cesium.Color.RED }
                    });

                    // Draw fixed ENU axes at model's real origin
                    addEnuAxes(cartesian, 50);

                    // Initialize clip box ENU→data-frame transform basis (using load-time modelMatrix)
                    setupClipFrames(cartesian);

                    viewer.flyTo(entity);

                    initGui();
                },
                (percent) => {
                    console.log('Lcc object loading: ' + (percent * 100).toFixed(1) + '%');
                },
                () => {
                    console.log('Lcc object loading failure');
                }
            );

            lccObj.setStartLod(0);
            lccObj.setMaxSplats(8000000);
            lccObj.setMaxNodeSplats(4000000);
            lccObj.setMaxDistance(200);
            lccObj.setLodAutoLevelUp(true);

            window.lccObj = lccObj;
            window.LCCRender = LCCRender;

            // ---- GUI: control model Translation / Rotation / Scale ----
            const state = {
                translation: { x: 0, y: 0, z: 0 }, // ENU local translation, unit: meters
                rotation: { heading: 0, pitch: 0, roll: 0 }, // unit: degrees
                scale: 1 // uniform scale factor (dimensionless)
            };

            function applyTranslation() {
                if (!lccReady) return;
                lccObj.setTranslation(new Cesium.Cartesian3(state.translation.x, state.translation.y, state.translation.z));
                refreshClipWire(); // clip wireframe follows model
                viewer.scene.requestRender();
            }

            function applyRotation() {
                if (!lccReady) return;
                // New API: input { heading, pitch, roll } (degrees)
                lccObj.setRotation({
                    heading: state.rotation.heading,
                    pitch: state.rotation.pitch,
                    roll: state.rotation.roll
                });
                refreshClipWire(); // clip wireframe follows model
                viewer.scene.requestRender();
            }

            function applyScale() {
                if (!lccReady) return;
                lccObj.setScale(state.scale); // uniform scale, single factor
                refreshClipWire(); // clip wireframe follows model
                viewer.scene.requestRender();
            }

            // ---- Clip box: panel uses ENU coords, converted to data-frame for setClipBox; clipping in pre-transform coords, follows model TRS ----
            const DEG = Math.PI / 180;
            let enu2clip = null; // ENU → data-frame (4x4), fixed at load-time modelMatrix
            let enu2clip3 = null; // rotation part (Matrix3)
            let clipWire = null; // yellow wireframe
            let lastDataBox = null; // latest data-frame box matrix, for refreshing wireframe after TRS
            const clipState = {
                enabled: false,
                east: 0,
                north: 0,
                up: 0,
                sizeX: 30,
                sizeY: 30,
                sizeZ: 15,
                rotZ: 0, // rotation around Up(Z) axis, degrees
                clipInside: true // true=clip inside, false=clip outside
            };

            // Build ENU→data-frame transform at load time: C = modelMatrix⁻¹ × (ENU→ECEF)
            function setupClipFrames(originEcef) {
                const enu2ecef = Cesium.Transforms.eastNorthUpToFixedFrame(originEcef);
                const modelMat = lccObj.modelMatrix ? Cesium.Matrix4.clone(lccObj.modelMatrix) : Cesium.Matrix4.clone(Cesium.Matrix4.IDENTITY);
                const modelInv = Cesium.Matrix4.inverse(modelMat, new Cesium.Matrix4());
                enu2clip = Cesium.Matrix4.multiply(modelInv, enu2ecef, new Cesium.Matrix4());
                enu2clip3 = Cesium.Matrix4.getMatrix3(enu2clip, new Cesium.Matrix3());
            }

            // XYZ Euler angles (radians) → Matrix3, order Rx·Ry·Rz, consistent with ClipBox internals
            function enuRotMatrix(rx, ry, rz) {
                const rxy = Cesium.Matrix3.multiply(Cesium.Matrix3.fromRotationX(rx), Cesium.Matrix3.fromRotationY(ry), new Cesium.Matrix3());
                return Cesium.Matrix3.multiply(rxy, Cesium.Matrix3.fromRotationZ(rz), new Cesium.Matrix3());
            }
            // Matrix3 → XYZ Euler angles (radians)
            function eulerXYZ(m) {
                const m00 = m[0],
                    m01 = m[3],
                    m02 = m[6],
                    m11 = m[4],
                    m12 = m[7],
                    m21 = m[5],
                    m22 = m[8];
                const y = Math.asin(Math.max(-1, Math.min(1, m02)));
                let x, z;
                if (Math.abs(m02) < 0.9999999) {
                    x = Math.atan2(-m12, m22);
                    z = Math.atan2(-m01, m00);
                } else {
                    x = Math.atan2(m21, m11);
                    z = 0;
                }
                return [x, y, z];
            }

            function ensureClipWire() {
                if (clipWire) return;
                const geom = Cesium.BoxOutlineGeometry.fromDimensions({ dimensions: new Cesium.Cartesian3(1, 1, 1) });
                const instance = new Cesium.GeometryInstance({
                    geometry: geom,
                    attributes: { color: Cesium.ColorGeometryInstanceAttribute.fromColor(Cesium.Color.YELLOW) }
                });
                clipWire = new Cesium.Primitive({
                    geometryInstances: instance,
                    appearance: new Cesium.PerInstanceColorAppearance({ flat: true, translucent: false }),
                    asynchronous: false
                });
                viewer.scene.primitives.add(clipWire);
            }

            // wireframe = current modelMatrix × data-frame box matrix → follows model TRS
            function refreshClipWire() {
                if (!clipWire || !lastDataBox || !clipState.enabled) return;
                clipWire.modelMatrix = Cesium.Matrix4.multiply(lccObj.modelMatrix, lastDataBox, new Cesium.Matrix4());
                viewer.scene.requestRender();
            }

            function applyClip() {
                if (!lccReady || !enu2clip) return;
                if (!clipState.enabled) {
                    lccObj.setClipBox(); // disable clipping
                    if (clipWire) clipWire.show = false;
                    viewer.scene.requestRender();
                    return;
                }
                // 1) Panel ENU box
                const posEnu = new Cesium.Cartesian3(clipState.east, clipState.north, clipState.up);
                const rotEnu3 = enuRotMatrix(0, 0, clipState.rotZ * DEG);
                // 2) ENU → data-frame
                const posClip = Cesium.Matrix4.multiplyByPoint(enu2clip, posEnu, new Cesium.Cartesian3());
                const rotClip3 = Cesium.Matrix3.multiply(enu2clip3, rotEnu3, new Cesium.Matrix3());
                const scale = [clipState.sizeX, clipState.sizeY, clipState.sizeZ];
                // 3) Submit (data-frame coordinates)
                lccObj.setClipBox({
                    position: [posClip.x, posClip.y, posClip.z],
                    scale,
                    rotation: eulerXYZ(rotClip3),
                    clipSide: clipState.clipInside ? -1 : 1
                });
                // 4) Wireframe: data-frame box matrix T·R·S, then × current modelMatrix
                const t = Cesium.Matrix4.fromTranslation(posClip);
                const r = Cesium.Matrix4.fromRotationTranslation(rotClip3, Cesium.Cartesian3.ZERO);
                const s = Cesium.Matrix4.fromScale(new Cesium.Cartesian3(scale[0], scale[1], scale[2]));
                lastDataBox = Cesium.Matrix4.multiply(Cesium.Matrix4.multiply(t, r, new Cesium.Matrix4()), s, new Cesium.Matrix4());
                ensureClipWire();
                clipWire.show = true;
                refreshClipWire();
                viewer.scene.requestRender();
            }

            // ---- Coordinate pick (raycast): when enabled, each click adds a marker with lon/lat/height (multi-pick); disabling clears all ----
            const pickState = { enabled: false };
            let pickEntities = []; // pick point markers (multiple)
            let pickHandler = null; // click event handler

            function clearPick() {
                if (pickEntities.length) {
                    pickEntities.forEach((e) => viewer.entities.remove(e));
                    pickEntities = [];
                    viewer.scene.requestRender();
                }
            }

            function onPickClick(evt) {
                if (!lccReady || !pickState.enabled) return;
                const checkPos = lccObj.raycast({ evt: evt.position, maxDistance: 2000, radius: 1.0, opacityThreshold: 0.1 });
                if (!checkPos) {
                    console.log('no point detect');
                    return;
                }
                const cart = new Cesium.Cartesian3(checkPos.x, checkPos.y, checkPos.z);
                const carto = Cesium.Cartographic.fromCartesian(cart);
                const lon = Cesium.Math.toDegrees(carto.longitude);
                const lat = Cesium.Math.toDegrees(carto.latitude);
                const h = carto.height;
                const label = `Lon ${lon.toFixed(6)}\nLat ${lat.toFixed(6)}\nHeight ${h.toFixed(2)} m`;
                console.log('detect lonLatHeight: ', lon, lat, h);

                const ent = viewer.entities.add({
                    position: cart,
                    point: { pixelSize: 10, color: Cesium.Color.YELLOW, disableDepthTestDistance: Number.POSITIVE_INFINITY },
                    label: {
                        text: label,
                        font: '13px monospace',
                        fillColor: Cesium.Color.WHITE,
                        showBackground: true,
                        backgroundColor: new Cesium.Color(0, 0, 0, 0.6),
                        pixelOffset: new Cesium.Cartesian2(12, 0),
                        horizontalOrigin: Cesium.HorizontalOrigin.LEFT,
                        disableDepthTestDistance: Number.POSITIVE_INFINITY
                    }
                });
                pickEntities.push(ent); // accumulate, supports multi-pick
                viewer.scene.requestRender();
            }

            function setPickEnabled(on) {
                pickState.enabled = on;
                if (on) {
                    if (!pickHandler) {
                        pickHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
                        pickHandler.setInputAction(onPickClick, Cesium.ScreenSpaceEventType.LEFT_CLICK);
                    }
                } else {
                    clearPick(); // clear markers when disabled
                }
            }

            function initGui() {
                const gui = new GUI({ title: 'Model TRS' });

                // Translation (ENU local, unit: meters)
                const fT = gui.addFolder('Translation (ENU m)');
                fT.add(state.translation, 'x', -50, 50, 0.1).name('East').onChange(applyTranslation);
                fT.add(state.translation, 'y', -50, 50, 0.1).name('North').onChange(applyTranslation);
                fT.add(state.translation, 'z', -50, 50, 0.1).name('Up').onChange(applyTranslation);
                fT.open();

                // Rotation (unit: degrees)
                const fR = gui.addFolder('Rotation (deg)');
                fR.add(state.rotation, 'heading', -180, 180, 1).name('Heading').onChange(applyRotation);
                fR.add(state.rotation, 'pitch', -180, 180, 1).name('Pitch').onChange(applyRotation);
                fR.add(state.rotation, 'roll', -180, 180, 1).name('Roll').onChange(applyRotation);
                fR.open();

                // Scale (uniform, single factor)
                const fS = gui.addFolder('Scale (uniform)');
                fS.add(state, 'scale', 0.1, 5, 0.01).name('Uniform').onChange(applyScale);
                fS.open();

                // Clip box (orientation follows model: position/rotation attached to model, moves with TRS)
                const fC = gui.addFolder('Clip (follows model)');
                fC.add(clipState, 'enabled').name('Enable').onChange(applyClip);
                fC.add(clipState, 'east', -100, 100, 0.5).name('X East(model)').onChange(applyClip);
                fC.add(clipState, 'north', -100, 100, 0.5).name('Y North(model)').onChange(applyClip);
                fC.add(clipState, 'up', -50, 50, 0.5).name('Z Up(model)').onChange(applyClip);
                fC.add(clipState, 'sizeX', 1, 200, 1).name('Size X').onChange(applyClip);
                fC.add(clipState, 'sizeY', 1, 200, 1).name('Size Y').onChange(applyClip);
                fC.add(clipState, 'sizeZ', 1, 100, 1).name('Size Z').onChange(applyClip);
                fC.add(clipState, 'rotZ', -180, 180, 1).name('Rot Z(deg)').onChange(applyClip);
                fC.add(clipState, 'clipInside').name('Clip Inside').onChange(applyClip);
                fC.open();

                // Display options
                const display = { showAxes: true };
                gui.add(display, 'showAxes')
                    .name('Show Axes')
                    .onChange((v) => setAxesVisible(v));

                // Coordinate pick (click to mark multiple points with lon/lat/height labels; disabling clears all)
                gui.add(pickState, 'enabled')
                    .name('Pick (multi)')
                    .onChange((v) => setPickEnabled(v));

                // Reset: zero out all components and re-apply
                const actions = {
                    reset() {
                        state.translation.x = state.translation.y = state.translation.z = 0;
                        state.rotation.heading = state.rotation.pitch = state.rotation.roll = 0;
                        state.scale = 1;
                        gui.controllersRecursive().forEach((c) => c.updateDisplay());
                        applyTranslation();
                        applyRotation();
                        applyScale();
                    }
                };
                gui.add(actions, 'reset').name('Reset');
            }
        </script>
    </body>
</html>
